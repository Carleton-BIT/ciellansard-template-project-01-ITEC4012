<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    {% for movie in movies %}
        <p>Title (Year): {{ movie.title }} ({{ movie.year }})</p>
        <p>ID: {{ movie.tmdb_id }}</p>
        <!--    <p>Keywords: {{ movie.keywords }}</p>-->
        <!--    <p>Genres: {{ movie.genres }}</p>-->
        <p>Rating: {{ movie.rating }}/10 ({{ movie.votes }} votes)</p>
        <p>Length: {{ movie.length }} min.</p>
        <p>Link: <a href="{{ movie.tmdb_link }}">{{ movie.tmdb_link }}</a></p>
        <img src="https://image.tmdb.org/t/p/w1280/{{ movie.poster_path }}" style="height: 200px;">
        <!--    <p>Info: {{ info }}</p>-->
        <hr>
    {% endfor %}
</body>
</html>
