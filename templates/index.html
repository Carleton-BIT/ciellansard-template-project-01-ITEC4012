<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Recommender</title>
<!--    {% load static %}-->
<!--    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<!--    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.png' %}">-->
</head>
<body>
    <div id="sideBar">
        <form method="post" enctype="multipart/form-data" hx-post="{% url 'index' %}" >
            {% csrf_token %}
            {{ form }}
            <button type="submit" id="submitButton">Get Recommendations</button>
        </form>
    </div>
    <div id="recommendationsPanel">

        <h1>{{ header }}</h1>

        {% for keyword in keywords_to_search %}
            <a href="https://www.themoviedb.org/keyword/{{ keyword.id }}-{{ keyword.keyword_name }}/movie">
                <span class="keyword">{{ keyword.keyword_name|title }}</span>
            </a>
        {% endfor %}

        {% for result in results %}
            {% include "recommendation.html" %}
        {% endfor %}
    </div>
</body>
</html>
